name: Build Android APK & iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1. BUILD FILE APK CHO ANDROID
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Thư viện & Thêm Android Platform
        run: |
          npm install
          npx cap add android

      - name: Đồng bộ & Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Xuất file APK ra Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FumeniERP-Android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ------------------------------------------------------------------
  # 2. BUILD FILE IPA CHO IOS
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cài đặt Thư viện & Thêm iOS Platform
        run: |
          npm install
          npx cap add ios

      - name: Build Xcode Project
        run: |
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Nén thành file IPA
        run: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          mkdir Payload
          mv App.app Payload/
          zip -r FumeniERP-iOS.ipa Payload

      - name: Xuất file IPA ra Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FumeniERP-iOS.ipa
          path: ios/App/build/Build/Products/Debug-iphoneos/FumeniERP-iOS.ipa
