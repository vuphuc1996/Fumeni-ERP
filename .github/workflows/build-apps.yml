name: Build FumeniERP Android APK and iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native icons and splash
        run: npm run assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FumeniERP-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate native icons and splash
        run: npm run assets

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        shell: bash
        run: |
          set -e
          APP_PATH="ios/build/Build/Products/Debug-iphoneos/App.app"
          mkdir -p ios/ipa/Payload
          cp -R "$APP_PATH" ios/ipa/Payload/
          cd ios/ipa
          zip -r ../../FumeniERP-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FumeniERP-iOS-Unsigned
          path: FumeniERP-iOS-unsigned.ipa
