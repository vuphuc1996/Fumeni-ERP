<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FumeniERP</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FumeniERP">

    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background-color: #0f172a;
            overscroll-behavior-y: none; /* Chống treo/đơ khi vuốt ở ngoài vỏ */
        }
        iframe {
            width: 100%; height: 100dvh; border: none; display: block;
        }
        .safe-pb { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="text-slate-800 antialiased select-none">

    <!-- BANNER HƯỚNG DẪN TẢI VỀ MH CHÍNH (Chỉ hiện khi mở trên Trình duyệt) -->
    <div id="pwa-install-banner" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex flex-col justify-end p-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-slide-up safe-pb">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png" class="w-12 h-12 rounded-2xl shadow-md border border-slate-100" alt="Logo">
                <div>
                    <h3 class="font-bold text-slate-900 text-base">Cài đặt Fumeni ERP</h3>
                    <p class="text-xs text-slate-500">Thêm ứng dụng vào Màn hình chính để dùng tràn màn hình</p>
                </div>
            </div>

            <!-- Hướng dẫn iOS Safari -->
            <div id="ios-instructions" class="bg-blue-50/80 border border-blue-100 rounded-2xl p-3.5 text-xs text-blue-900 space-y-2">
                <p class="font-bold flex items-center gap-1.5 text-blue-700">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i> Cách thêm trên iPhone / iPad:
                </p>
                <ol class="list-decimal list-inside space-y-1 text-[11px] text-slate-700 font-medium">
                    <li>Bấm nút <strong class="text-blue-600">Chia sẻ (Share <i class="fa-solid fa-arrow-up-from-bracket text-[10px]"></i>)</strong> ở thanh dưới trình duyệt.</li>
                    <li>Cuộn xuống chọn <strong class="text-slate-900">"Thêm vào MH chính" (Add to Home Screen)</strong>.</li>
                    <li>Mở icon từ màn hình chính để vào App tràn 100%.</li>
                </ol>
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="launchAppDirectly()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-blue-500/30 active:scale-95 transition-all">
                    Vào trực tiếp App Web
                </button>
            </div>
        </div>
    </div>

    <!-- IFRAME CHỨA WEB APP GAS -->
    <iframe id="app-iframe" 
        src="https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec" 
        allow="geolocation; microphone; camera; clipboard-write"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>

    <script>
        // Kiểm tra xem trang có đang mở ở chế độ Standalone (App Màn hình chính) không
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

        if (!isStandalone) {
            // Nếu mở bằng Safari/Chrome trình duyệt thông thường -> Hiện Banner hướng dẫn
            document.getElementById('pwa-install-banner').classList.remove('hidden');
        }

        function launchAppDirectly() {
            document.getElementById('pwa-install-banner').classList.add('hidden');
        }
    </script>
</body>
</html>
