<!DOCTYPE html>
<!--
  =====================================================================
  FUMENI ERP ENGINE - index.html (GitHub Pages Bridge)
  Deploy tại: https://vuphuc1996.github.io/Fumeni-ERP/  (URL này KHÔNG đổi,
  dù truy cập từ Laptop/PC hay từ app đã "Add to Home Screen" trên Mobile).

  Vai trò: đây là PWA Shell tĩnh — không chứa logic nghiệp vụ.
  Nó phát hiện thiết bị, hiện màn hình chờ có logo, rồi nhúng URL Web App thật
  của Apps Script vào iframe. URL GitHub vẫn giữ nguyên trong suốt phiên làm việc;
  người dùng chỉ cần nhớ/lưu đúng 1 link GitHub này.

  Mobile "biến thành app": file này + manifest.json + sw.js làm cho trang đủ
  điều kiện để trình duyệt Mobile cho phép "Thêm vào Màn hình chính". Sau khi
  thêm, chạm vào icon sẽ mở KHÔNG có thanh địa chỉ/trình duyệt (display:
  standalone) — cảm giác như 1 app thật — và bên trong Login.html của Apps
  Script sẽ CHẶN không cho dùng nếu người dùng cố mở bằng trình duyệt thường
  trên Mobile (bắt buộc phải cài app trước), đúng yêu cầu không cho "share ra
  màn hình giao diện như web" trên Mobile.
  =====================================================================
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fumeni ERP Engine</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
<meta name="theme-color" content="#0E1826">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{ --navy:#0E1826; --brass:#C79A4B; --slate:#8C97AC; --line:rgba(245,242,236,0.12); }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ width:100%; height:100%; min-height:100%; margin:0; background:var(--navy); }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; touch-action:manipulation; }
  body{
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family:'Inter', -apple-system, sans-serif; color:#F5F2EC;
    padding-top:0; padding-bottom:0;
    background:
      radial-gradient(circle at 20% 15%, rgba(199,154,75,0.10), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(199,154,75,0.06), transparent 40%),
      var(--navy);
  }
  .rail{ position:fixed; top:0; left:0; right:0; height:3px; display:flex; }
  .rail span{ flex:1; }
  .rail span:nth-child(1){ background:#C79A4B; } .rail span:nth-child(2){ background:#8C97AC; }
  .rail span:nth-child(3){ background:#5E86A8; } .rail span:nth-child(4){ background:#7CCB9C; }
  .rail span:nth-child(5){ background:#E0645A; }
  .logo-wrap{ width:78px; height:78px; border-radius:18px; overflow:hidden; margin-bottom:22px;
    box-shadow:0 0 0 1px var(--line), 0 12px 30px rgba(0,0,0,0.35); animation:pulse 1.8s ease-in-out infinite; }
  .logo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
  h1{ font-family:'Source Serif 4', Georgia, serif; font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:0.3px; }
  p.sub{ color:var(--slate); font-size:13px; margin:0 0 26px; text-align:center; max-width:280px; }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:6px; height:6px; border-radius:50%; background:var(--brass); opacity:0.25; animation:dot 1.2s ease-in-out infinite; }
  .dots span:nth-child(2){ animation-delay:0.15s; } .dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes dot{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:1; } }
  .fallback{ display:none; margin-top:22px; text-align:center; }
  .fallback.show{ display:block; }
  .fallback a{ display:inline-block; margin-top:10px; background:var(--brass); color:var(--navy);
    text-decoration:none; font-weight:600; font-size:13px; padding:10px 22px; border-radius:6px; }
  .fallback .err{ color:#F3B4AE; font-size:12.5px; }

  /* =====================================================================
     IFRAME APP SHELL
     GitHub remains the top-level page; Apps Script occupies the app viewport.
     ===================================================================== */
  body{ overflow:hidden; position:relative; width:100%; height:100dvh;
    background-image:url("https://vuphuc1996.github.io/Fumeni-ERP/assets/bg-login.jpg"); background-size:cover; background-position:center; min-height:100dvh; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  #fumeniAppFrame{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    max-height:100dvh;
    border:0;
    margin:0;
    padding:0;
    background:var(--navy);
    display:block;
    opacity:0;
    z-index:10;
    transition:opacity .18s ease;
  }
  body.app-ready > #fumeniAppFrame{ opacity:1; }
  #splashScreen{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:
      radial-gradient(circle at 20% 15%, rgba(199,154,75,0.10), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(199,154,75,0.06), transparent 40%),
      var(--navy);
    transition:opacity .18s ease, visibility .18s ease;
  }
  body.app-ready #splashScreen{ opacity:0; visibility:hidden; pointer-events:none; }
  @media (max-width:820px){
    #fumeniAppFrame{ min-height:100dvh; height:100dvh; }
    #splashScreen{ padding:env(safe-area-inset-top,0px) 16px 0; }
  }

</style>
</head>
<body>
  <div id="splashScreen">
  <div class="rail"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="logo-wrap"><img src="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png" alt="Fumeni ERP"></div>
  <h1>Fumeni ERP Engine</h1>
  <p class="sub" id="statusText">Đang chuyển vào hệ thống...</p>
  <div class="dots" id="dots"><span></span><span></span><span></span></div>
  <div class="fallback" id="fallbackBox">
    <div class="err" id="fallbackErr"></div>
    <a href="#" id="fallbackLink">Vào hệ thống thủ công</a>
  </div>
  </div>

<script>
(function(){
  // iPhone/Safari: khóa zoom ở lớp PWA shell để tránh phóng to toàn bộ app.
  (function lockShellZoom(){
    var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    if (!touch || window.matchMedia("(min-width:821px)").matches) return;
    ["gesturestart","gesturechange","gestureend"].forEach(function(type){
      document.addEventListener(type, function(e){ e.preventDefault(); }, {passive:false});
    });
    var lastTouchEnd = 0;
    document.addEventListener("touchend", function(e){
      var now = Date.now();
      if (now - lastTouchEnd <= 280) e.preventDefault();
      lastTouchEnd = now;
    }, {passive:false});
  })();

  // ===================================================================
  // FUMENI ERP — GITHUB PWA SHELL / IFRAME BRIDGE
  // GitHub URL luôn là URL người dùng mở/lưu/cài PWA.
  // Apps Script chỉ được tải bên trong iframe, KHÔNG redirect trang cha.
  // ===================================================================
  var CONFIG = {
    // URL Web App Apps Script dùng cho bản test hiện tại bạn đã gửi.
    GAS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec",
    LOAD_TIMEOUT_MS: 18000,
    SPLASH_MIN_MS: 450,
    BG_LOGIN_URL: "https://vuphuc1996.github.io/Fumeni-ERP/assets/bg-login.jpg",
    BG_DESKTOP_URL: "https://vuphuc1996.github.io/Fumeni-ERP/assets/bg-desktop.jpg",
    BG_MOBILE_URL: "https://vuphuc1996.github.io/Fumeni-ERP/assets/bg-mobile.jpg"
  };

  var shellStartedAt = Date.now();
  var frame = null;
  var device = detectDevice();
  var lang = detectLang();
  var standalone = isStandalone();

  function applyShellBackground(){
    var url = device === "mobile" ? CONFIG.BG_MOBILE_URL : CONFIG.BG_DESKTOP_URL;
    document.body.style.backgroundImage = "url(\"" + url + "\")";
    var splash = document.getElementById("splashScreen");
    if (splash) splash.style.backgroundImage = "linear-gradient(rgba(14,24,38,.78),rgba(14,24,38,.92)), url(\"" + url + "\")";
  }
  applyShellBackground();

  function detectDevice(){
    var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    var isNarrow = window.matchMedia("(max-width: 820px)").matches;
    return (isTouch && isNarrow) ? "mobile" : "desktop";
  }

  function detectLang(){
    try {
      var saved = localStorage.getItem("fumeni_lang") || "vie";
      return String(saved).toLowerCase() === "eng" ? "eng" : "vie";
    } catch (e) {
      return "vie";
    }
  }

  function isStandalone(){
    try {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.matchMedia("(display-mode: fullscreen)").matches ||
             window.navigator.standalone === true;
    } catch(e) {
      return false;
    }
  }

  function setStatus(text){
    var el = document.getElementById("statusText");
    if (el) el.textContent = text;
  }

  function showFallback(message, url){
    var dots = document.getElementById("dots");
    var box = document.getElementById("fallbackBox");
    var err = document.getElementById("fallbackErr");
    var link = document.getElementById("fallbackLink");
    if (dots) dots.style.display = "none";
    if (box) box.classList.add("show");
    if (err) err.textContent = message || "";
    if (link) {
      link.href = url || "#";
      link.style.display = url ? "inline-block" : "none";
    }
    setStatus("Không thể tải hệ thống trong khung ứng dụng.");
  }

  function hideSplash(){
    var elapsed = Date.now() - shellStartedAt;
    var wait = Math.max(0, CONFIG.SPLASH_MIN_MS - elapsed);
    setTimeout(function(){
      document.body.classList.add("app-ready");
      var splash = document.getElementById("splashScreen");
      if (splash) splash.setAttribute("aria-hidden", "true");
    }, wait);
  }

  function buildTargetUrl(){
    var sep = CONFIG.GAS_WEBAPP_URL.indexOf("?") > -1 ? "&" : "?";
    return CONFIG.GAS_WEBAPP_URL + sep +
      "device=" + encodeURIComponent(device) +
      "&lang=" + encodeURIComponent(lang) +
      "&standalone=" + (standalone ? "1" : "0") +
      "&shell=github-iframe&theme=github";
  }

  function mountFrame(targetUrl){
    frame = document.createElement("iframe");
    frame.id = "fumeniAppFrame";
    frame.title = "Fumeni ERP";
    frame.src = targetUrl;
    frame.setAttribute("allow", "camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; publickey-credentials-get; publickey-credentials-create");
    frame.setAttribute("allowfullscreen", "true");
    frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    frame.setAttribute("loading", "eager");
    frame.addEventListener("load", function(){
      clearTimeout(loadTimer);
      setStatus("Fumeni ERP");
      hideSplash();
      // Chỉ gửi context không nhạy cảm. Token/session không bao giờ truyền qua bridge.
      try {
        frame.contentWindow.postMessage({
          type: "FUMENI_SHELL_CONTEXT",
          device: device,
          lang: lang,
          standalone: standalone,
          version: "github-iframe-v1"
        }, "*");
      } catch(e) {}
    });
    frame.addEventListener("error", function(){
      showFallback("Không thể tải Apps Script Web App.", targetUrl);
    });

    document.body.appendChild(frame);

    var loadTimer = setTimeout(function(){
      showFallback("Apps Script phản hồi quá lâu hoặc bị trình duyệt chặn trong iframe.", targetUrl);
    }, CONFIG.LOAD_TIMEOUT_MS);
  }

  if (!CONFIG.GAS_WEBAPP_URL || CONFIG.GAS_WEBAPP_URL.indexOf("__DEIN_DEPLOYMENT_ID__") > -1) {
    showFallback("Chưa cấu hình GAS_WEBAPP_URL trong index.html.");
    return;
  }

  // Hiển thị device context ở shell; CSS/layout của GAS vẫn do chính Apps Script quyết định.
  document.documentElement.dataset.device = device;
  document.documentElement.dataset.lang = lang;
  document.documentElement.dataset.standalone = standalone ? "1" : "0";

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* không chặn app */ });
  }

  mountFrame(buildTargetUrl());
})();
</script>
</body>
</html>
