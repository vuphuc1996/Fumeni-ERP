<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FumeniERP">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
  <link rel="manifest" href="manifest.json">
  <title>FumeniERP</title>
  <style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #0f172a;
  }

  body {
    position: fixed;
    inset: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100dvh;
    height: 100%;
    border: 0;
    background: #0f172a;
  }

  #pwa-banner {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    place-items: center;
    padding: 16px;
    background: rgba(15, 23, 42, .94);
    backdrop-filter: blur(12px);
  }

  #pwa-card {
    width: min(100%, 380px);
    padding: 22px;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 24px;
    background: #fff;
    color: #0f172a;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    text-align: center;
  }

  #pwa-card img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    padding: 6px;
  }

  #pwa-card h3 {
    margin: 12px 0 6px;
    font-size: 18px;
  }

  #pwa-card p {
    margin: 0;
    color: #64748b;
    font-size: 12px;
    line-height: 1.55;
  }

  #ios-help {
    display: none;
    margin-top: 14px;
    padding: 12px;
    border-radius: 16px;
    background: #eff6ff;
    color: #1e3a8a;
    text-align: left;
    font-size: 11px;
    line-height: 1.5;
  }

  #install-btn {
    display: none;
    width: 100%;
    margin-top: 16px;
    min-height: 46px;
    border: 0;
    border-radius: 14px;
    background: #16a34a;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  </style>
</head>

<body>
  <div id="pwa-banner">
    <div id="pwa-card">
      <img src="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png" alt="FumeniERP">
      <h3>Cài FumeniERP</h3>
      <p>Thêm ứng dụng vào màn hình chính để mở nhanh và ổn định hơn trên điện thoại.</p>
      <div id="ios-help">
        <b>iPhone/iPad:</b> mở menu Chia sẻ của Safari → <b>Thêm vào Màn hình chính</b> → <b>Thêm</b>.
      </div>
      <button id="install-btn" type="button">Cài đặt App</button>
    </div>
  </div>
  <iframe id="app-iframe" title="FumeniERP" allow="camera *; microphone *; geolocation *; publickey-credentials-get *; publickey-credentials-create *" sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec";
  const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
  const isMobile = navigator.userAgentData?.mobile === true || isIOS || /Android|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.matchMedia("(max-width: 768px)").matches;
  const deviceMode = isMobile ? "mobile" : "desktop";
  const iframe = document.getElementById("app-iframe");

  const params = new URLSearchParams({
    device: deviceMode
  });
  iframe.src = `${GAS_URL}?${params.toString()}`;

  let deferredPrompt = null;
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    if (isMobile && !standalone) document.getElementById("pwa-banner").style.display = "grid";
    if (!isIOS) document.getElementById("install-btn").style.display = "block";
  });
  window.addEventListener("load", () => {
    if (isMobile && !standalone && isIOS) {
      document.getElementById("pwa-banner").style.display = "grid";
      document.getElementById("ios-help").style.display = "block";
    }
  });
  document.getElementById("install-btn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    await deferredPrompt.prompt();
    deferredPrompt = null;
    document.getElementById("pwa-banner").style.display = "none";
  });
  const syncHeight = () => {
    const h = window.visualViewport?.height || window.innerHeight;
    iframe.style.height = `${h}px`;
  };
  window.visualViewport?.addEventListener("resize", syncHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncHeight, 250));
  syncHeight();
  </script>
  <script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>

</html>
