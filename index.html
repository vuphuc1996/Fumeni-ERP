<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test WebAuthn & GAS</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f6f9; }
    .btn { background: #0056b3; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
    iframe { width: 100%; height: 250px; border: 2px dashed #0056b3; border-radius: 8px; background: white; }
  </style>
</head>
<body>

  <h2>Hệ thống Test Xác thực</h2>
  <button class="btn" onclick="testXacThuc()">🔒 Quét Face ID / Vân tay</button>

  <!-- Dán URL Web App của Google Apps Script vào thuộc tính src dưới đây -->
  <iframe id="appGasFrame" src="https://script.google.com/home/projects/1xIGFn1HLSnJ2ONf-SgvlB4Z7DNFvVnIB9_j2mF-IhFB8X4skWpwvJ-Ka/edit"></iframe>

  <script>
    async function testXacThuc() {
      if (!window.PublicKeyCredential) {
        alert("Trình duyệt không hỗ trợ WebAuthn!");
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        // Gọi pop-up sinh trắc học thiết bị
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "Test ERP" },
            user: { id: new Uint8Array(16), name: "tester", displayName: "Tester" },
            pubKeyCredParams: [{ type: "publickey", alg: -7 }],
            timeout: 60000,
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
          }
        });

        if (credential) {
          // Gửi thông điệp xác thực vào Iframe GAS
          const iframe = document.getElementById('appGasFrame');
          iframe.contentWindow.postMessage({
            action: 'CHAM_CONG_APPROVED',
            timestamp: new Date().getTime()
          }, '*');
        }
      } catch (err) {
        console.error(err);
        alert("Xác thực thất bại hoặc người dùng đã hủy.");
      }
    }
  </script>
</body>
</html>
