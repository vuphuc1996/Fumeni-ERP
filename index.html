<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FumeniERP">
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="manifest" href="./manifest.json">
    <title>FumeniERP</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        body {
            display: grid;
            place-items: center
        }

        .gate {
            width: min(92vw, 420px);
            text-align: center
        }

        .gate img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 18px;
            background: #fff;
            padding: 6px
        }

        .gate h1 {
            font-size: 20px;
            margin: 16px 0 6px
        }

        .gate p {
            font-size: 12px;
            line-height: 1.6;
            color: #cbd5e1
        }

        .guide {
            margin-top: 18px;
            padding: 16px;
            border-radius: 18px;
            background: #fff;
            color: #0f172a;
            text-align: left;
            font-size: 12px;
            line-height: 1.6
        }

        .guide b {
            color: #1d4ed8
        }

        .btn {
            display: none;
            margin-top: 14px;
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            font-weight: 800
        }
    </style>
</head>

<body>
    <div class="gate"><img src="./logo.png" alt="FumeniERP">
        <h1>FumeniERP Mobile</h1>
        <p id="state">Đang kiểm tra chế độ ứng dụng…</p>
        <div id="guide" class="guide">Để sử dụng FumeniERP như một ứng dụng, hãy chọn <b>Chia sẻ → Thêm vào Màn hình chính</b>, sau đó mở FumeniERP từ biểu tượng trên Màn hình chính.</div><button id="open" class="btn" type="button">Mở FumeniERP</button>
    </div>
    <script>
        (() => {
            const GAS = 'https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec';
            const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(max-width:768px)').matches;
            const url = `${GAS}?device=${mobile?'mobile':'desktop'}&v=3.13`;
            const state = document.getElementById('state'),
                guide = document.getElementById('guide'),
                open = document.getElementById('open');
            if (standalone) {
                state.textContent = 'Đang mở FumeniERP…';
                guide.style.display = 'none';
                location.replace(url);
                return;
            }
            if (!mobile) {
                guide.style.display = 'none';
                open.style.display = 'block';
                open.textContent = 'Mở FumeniERP';
                open.onclick = () => location.href = url;
                state.textContent = 'Bạn đang dùng FumeniERP trên trình duyệt máy tính.';
            } else {
                state.textContent = 'Chưa chạy ở chế độ ứng dụng.';
                open.style.display = 'none';
            }
        })();
    </script>
</body>

</html>
