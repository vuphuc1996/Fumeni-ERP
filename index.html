<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FumeniERP">
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="manifest" href="./manifest.json">
    <title>FumeniERP</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #0f172a;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif
        }

        body {
            min-height: 100dvh;
            display: grid;
            place-items: center
        }

        #shell {
            width: 100%;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 20px;
            box-sizing: border-box
        }

        #card {
            width: min(100%, 420px);
            background: #fff;
            border-radius: 28px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
            color: #0f172a
        }

        #card img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            padding: 7px
        }

        #card h1 {
            font-size: 20px;
            margin: 14px 0 8px
        }

        #card p {
            font-size: 13px;
            line-height: 1.6;
            color: #64748b;
            margin: 0
        }

        #ios-help,
        #android-help {
            display: none;
            margin-top: 16px;
            padding: 14px;
            border-radius: 16px;
            font-size: 12px;
            line-height: 1.6;
            text-align: left
        }

        #ios-help {
            background: #eff6ff;
            color: #1e3a8a
        }

        #android-help {
            background: #f0fdf4;
            color: #166534
        }

        #install-btn {
            display: none;
            width: 100%;
            height: 48px;
            margin-top: 16px;
            border: 0;
            border-radius: 14px;
            background: #16a34a;
            color: white;
            font-weight: 800;
            font-size: 14px
        }
    </style>
</head>

<body>
    <div id="shell">
        <div id="card"><img src="./logo.png" alt="FumeniERP">
            <h1>FumeniERP</h1>
            <p id="message">Đang chuẩn bị ứng dụng…</p>
            <div id="ios-help"><b>iPhone/iPad:</b> Safari → Chia sẻ → Thêm vào Màn hình chính → Thêm. Sau đó mở FumeniERP từ biểu tượng trên Màn hình chính.</div>
            <div id="android-help"><b>Android:</b> chọn Thêm vào màn hình chính hoặc Cài đặt ứng dụng, sau đó mở FumeniERP từ màn hình chính.</div><button id="install-btn" type="button">Cài đặt FumeniERP</button>
        </div>
    </div>
    <script>
        (() => {
            const GAS_URL = "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec";
            const V = "3.12";
            const ios = /iPad|iPhone|iPod/i.test(navigator.userAgent);
            const android = /Android/i.test(navigator.userAgent);
            const mobile = ios || android || navigator.userAgentData?.mobile === true || matchMedia('(max-width:768px)').matches;
            const standalone = matchMedia('(display-mode:standalone)').matches || navigator.standalone === true;
            const msg = document.getElementById('message'),
                iosHelp = document.getElementById('ios-help'),
                androidHelp = document.getElementById('android-help'),
                btn = document.getElementById('install-btn');
            const go = m => location.replace(`${GAS_URL}?device=${m}&v=${V}`);
            if (!mobile) {
                go('desktop');
                return;
            }
            if (standalone) {
                go('mobile');
                return;
            }
            msg.textContent = 'Để sử dụng FumeniERP như một ứng dụng, hãy thêm ứng dụng vào Màn hình chính.';
            if (ios) iosHelp.style.display = 'block';
            if (android) androidHelp.style.display = 'block';
            let prompt = null;
            addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                prompt = e;
                btn.style.display = 'block'
            });
            btn.addEventListener('click', async () => {
                if (!prompt) return;
                try {
                    await prompt.prompt();
                    await prompt.userChoice
                } catch (_) {}
                prompt = null;
                btn.style.display = 'none'
            });
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=3.12').catch(() => {});
    </script>
</body>

</html>
