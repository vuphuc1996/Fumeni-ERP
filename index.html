<!DOCTYPE html>
<!--
  =====================================================================
  FUMENI ERP ENGINE - index.html (GitHub Pages Bridge)
  Bước 12: Cổng trung gian tối giản URL — https://vuphuc1996.github.io/Fumeni-ERP/
  - Nhận diện thiết bị (Desktop/Tablet lớn vs Mobile/Tablet nhỏ) NGAY tại cổng
    này (trước khi vào Script), rồi chuyển hướng vào Apps Script Web App kèm
    tham số ?device=... để Login.html/Index.html khỏi phải đoán lại từ đầu.
  - Đảm nhiệm load Logo + Background (asset tĩnh) — Script chỉ lo thiết kế,
    logic, Module, Modal, Icon như đã thống nhất.
  - Có manifest.json + sw.js để hỗ trợ "Add to Home Screen" (PWA) trên Mobile,
    đúng yêu cầu khống chế không cho dùng trực tiếp trên trình duyệt Mobile.
  =====================================================================
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fumeni ERP Engine</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png">
<meta name="theme-color" content="#0E1826">
<style>
  :root{
    --navy:#0E1826; --brass:#C79A4B; --slate:#8C97AC; --line:rgba(245,242,236,0.12);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:var(--navy); }
  body{
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    font-family:'Inter', -apple-system, sans-serif; color:#F5F2EC;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background:
      radial-gradient(circle at 20% 15%, rgba(199,154,75,0.10), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(199,154,75,0.06), transparent 40%),
      var(--navy);
  }
  .rail{ position:fixed; top:0; left:0; right:0; height:3px; display:flex; }
  .rail span{ flex:1; }
  .rail span:nth-child(1){ background:#C79A4B; }
  .rail span:nth-child(2){ background:#8C97AC; }
  .rail span:nth-child(3){ background:#5E86A8; }
  .rail span:nth-child(4){ background:#7CCB9C; }
  .rail span:nth-child(5){ background:#E0645A; }

  .logo-wrap{ width:78px; height:78px; border-radius:18px; overflow:hidden; margin-bottom:22px;
    box-shadow:0 0 0 1px var(--line), 0 12px 30px rgba(0,0,0,0.35); animation:pulse 1.8s ease-in-out infinite; }
  .logo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }

  h1{ font-family:'Source Serif 4', Georgia, serif; font-size:20px; font-weight:600; margin:0 0 6px; letter-spacing:0.3px; }
  p.sub{ color:var(--slate); font-size:13px; margin:0 0 26px; text-align:center; max-width:280px; }

  .dots{ display:flex; gap:6px; }
  .dots span{ width:6px; height:6px; border-radius:50%; background:var(--brass); opacity:0.25; animation:dot 1.2s ease-in-out infinite; }
  .dots span:nth-child(2){ animation-delay:0.15s; }
  .dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes dot{ 0%,80%,100%{ opacity:0.25; } 40%{ opacity:1; } }

  .fallback{ display:none; margin-top:22px; text-align:center; }
  .fallback.show{ display:block; }
  .fallback a{
    display:inline-block; margin-top:10px; background:var(--brass); color:var(--navy);
    text-decoration:none; font-weight:600; font-size:13px; padding:10px 22px; border-radius:6px;
  }
  .fallback .err{ color:#F3B4AE; font-size:12.5px; }
</style>
</head>
<body>
  <div class="rail"><span></span><span></span><span></span><span></span><span></span></div>

  <div class="logo-wrap"><img src="https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png" alt="Fumeni ERP"></div>
  <h1>Fumeni ERP Engine</h1>
  <p class="sub" id="statusText">Đang chuyển vào hệ thống...</p>
  <div class="dots" id="dots"><span></span><span></span><span></span></div>

  <div class="fallback" id="fallbackBox">
    <div class="err" id="fallbackErr"></div>
    <a href="#" id="fallbackLink">Vào hệ thống thủ công</a>
  </div>

<script>
(function(){
  // ===================================================================
  // CẤU HÌNH — điền GAS_WEBAPP_URL sau khi Deploy Apps Script dưới dạng
  // Web App (Execute as: Me / Anyone). Đây là URL /exec duy nhất, dùng
  // chung cho mọi Client (đa tenant phân biệt qua ClientID lúc đăng nhập).
  // ===================================================================
  var CONFIG = {
    GAS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec",
    LOGO: "https://raw.githubusercontent.com/vuphuc1996/Fumeni-ERP/main/logo.png",
    REDIRECT_DELAY_MS: 550 // giữ splash 1 nhịp ngắn để tránh chớp trắng khi mạng nhanh
  };

  // ---------- Nhận diện thiết bị (đồng bộ logic với Login.html) ----------
  function detectDevice(){
    var isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
    var isNarrow = window.matchMedia("(max-width: 820px)").matches;
    return (isTouch && isNarrow) ? "mobile" : "desktop";
  }

  // ---------- Ngôn ngữ đã lưu trước đó (nếu có) để Script khỏi hỏi lại ----------
  function detectLang(){
    try { return localStorage.getItem("fumeni_lang") || "vie"; } catch (e) { return "vie"; }
  }

  var device = detectDevice();
  var lang = detectLang();

  if (!CONFIG.GAS_WEBAPP_URL || CONFIG.GAS_WEBAPP_URL.indexOf("__DEIN_DEPLOYMENT_ID__") > -1) {
    showFallback("Chưa cấu hình GAS_WEBAPP_URL trong index.html — vui lòng Deploy Apps Script dưới dạng Web App rồi cập nhật lại đường dẫn.");
    return;
  }

  var targetUrl = CONFIG.GAS_WEBAPP_URL + "?device=" + device + "&lang=" + lang;

  setTimeout(function(){
    try {
      window.location.replace(targetUrl);
      // Phòng trường hợp trình duyệt chặn replace (hiếm) — timeout hiển thị nút thủ công
      setTimeout(function(){ showFallback(null, targetUrl); }, 4000);
    } catch (e) {
      showFallback("Không thể tự động chuyển hướng. Vui lòng bấm vào nút bên dưới.", targetUrl);
    }
  }, CONFIG.REDIRECT_DELAY_MS);

  function showFallback(errMsg, url){
    document.getElementById("dots").style.display = "none";
    document.getElementById("statusText").textContent = "Không thể tự động chuyển vào hệ thống.";
    var box = document.getElementById("fallbackBox");
    box.classList.add("show");
    document.getElementById("fallbackErr").textContent = errMsg || "";
    var link = document.getElementById("fallbackLink");
    link.href = url || "#";
    if (!url) link.style.display = "none";
  }

  // ---------- Đăng ký Service Worker (hỗ trợ điều kiện "Add to Home Screen") ----------
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function(){ /* im lặng nếu môi trường không hỗ trợ */ });
  }
})();
</script>
</body>
</html>
