<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fumeni ERP - Chấm công Face ID</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fumeni ERP">

  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f4f6f9; 
      margin: 0;
    }
    .card { 
      background: white; 
      padding: 30px 20px; 
      border-radius: 16px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      max-width: 400px; 
      margin: auto; 
    }
    h2 { color: #0056b3; margin-top: 0; }
    p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
    .btn { 
      background: #0056b3; 
      color: white; 
      border: none; 
      padding: 16px 24px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 12px; 
      cursor: pointer; 
      width: 100%; 
      box-shadow: 0 4px 10px rgba(0,86,179,0.3);
      margin-bottom: 12px;
    }
    .btn-green { background: #28a745; }
    .btn:active { opacity: 0.8; }
    #status { margin-top: 20px; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Fumeni ERP</h2>
    <p>Xác thực danh tính bằng Face ID trên iPhone.</p>
    
    <!-- Nút 1: Đăng ký lần đầu -->
    <button class="btn btn-green" onclick="dangKyFaceID()">1. Đăng ký Face ID</button>
    
    <!-- Nút 2: Chấm công hằng ngày -->
    <button class="btn" onclick="thucHienChamCong()">2. Chấm công ngay</button>
    
    <div id="status"></div>
  </div>

  <script>
  // Bước 1: Đăng ký Face ID (Tối ưu hóa tham số cho Safari iOS)
  async function dangKyFaceID() {
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = "🔒 Đang kích hoạt đăng ký Face ID...";
    statusEl.style.color = "#0056b3";

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      // Tạo mảng byte chuẩn cho user ID
      const userId = new Uint8Array([70, 117, 109, 101, 110, 105, 83, 101, 99, 117, 114, 101]);

      const options = {
        publicKey: {
          challenge: challenge,
          rp: { 
            name: "Fumeni ERP",
            id: window.location.hostname // Gán đúng domain GitHub Pages
          },
          user: { 
            id: userId, 
            name: "nhanvien@fumeni.local", 
            displayName: "Nhân viên Fumeni" 
          },
          // Chỉ giữ lại thuật toán ES256 (-7) mà Apple Secure Enclave hỗ trợ tốt nhất
          pubKeyCredParams: [
            { type: "publickey", alg: -7 }
          ],
          authenticatorSelection: { 
            authenticatorAttachment: "platform", // Bắt buộc dùng Face ID/Touch ID có sẵn
            userVerification: "required"
            // Đã lược bỏ residentKey để tránh lỗi TypeError trên một số phiên bản Safari iOS
          },
          timeout: 60000,
          attestation: "none"
        }
      };

      const credential = await navigator.credentials.create(options);

      if (credential) {
        statusEl.innerHTML = "✅ Đăng ký thành công! Bạn có thể bấm Chấm công.";
        statusEl.style.color = "green";
      }
    } catch (err) {
      console.error("Lỗi đăng ký:", err);
      statusEl.innerHTML = "❌ Đăng ký thất bại: " + (err.message || err);
      statusEl.style.color = "red";
    }
  }

  // Bước 2: Chấm công bằng Face ID đã đăng ký
  async function thucHienChamCong() {
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = "🔒 Đang gọi Face ID...";
    statusEl.style.color = "#0056b3";

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const options = {
        publicKey: {
          challenge: challenge,
          timeout: 60000,
          userVerification: "required"
        }
      };

      const credential = await navigator.credentials.get(options);

      if (credential) {
        statusEl.innerHTML = "⏳ Đang gửi dữ liệu lên Google Sheet...";

        // Thay link /exec của Google Apps Script vào đây
        const gasUrl = "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec";
        const timestamp = new Date().getTime();
        const targetUrl = `${gasUrl}?action=cham_cong&timestamp=${timestamp}`;

        const response = await fetch(targetUrl);
        const resultText = await response.text();

        statusEl.innerHTML = "✅ " + resultText;
        statusEl.style.color = "green";
      }
    } catch (err) {
      console.error("Lỗi chấm công:", err);
      statusEl.innerHTML = "❌ Xác thực thất bại hoặc chưa đăng ký Face ID.";
      statusEl.style.color = "red";
    }
  }
</script>
</body>
</html>
