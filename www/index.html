<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fumeni ERP - Chấm công</title>
  
  <!-- Cấu hình hiển thị như App thật trên màn hình chính iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fumeni ERP">

  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      text-align: center; 
      padding: 40px 20px; 
      background: #f4f6f9; 
      margin: 0;
    }
    .card { 
      background: white; 
      padding: 30px 20px; 
      border-radius: 16px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      max-width: 400px; 
      margin: auto; 
    }
    h2 { color: #0056b3; margin-top: 0; }
    p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
    .btn { 
      background: #0056b3; 
      color: white; 
      border: none; 
      padding: 16px 24px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 12px; 
      cursor: pointer; 
      width: 100%; 
      box-shadow: 0 4px 10px rgba(0,86,179,0.3);
    }
    .btn:active { background: #004085; }
    #status { margin-top: 20px; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

  <div class="card">
  <h2>Fumeni ERP</h2>
  <p>Thiết lập và chấm công bằng Face ID.</p>
  
  <!-- Nút đăng ký lần đầu -->
  <button class="btn" style="background: #28a745; margin-bottom: 10px;" onclick="dangKyFaceID()">1. Đăng ký Face ID với máy</button>
  
  <!-- Nút chấm công chính thức -->
  <button class="btn" onclick="thucHienChamCong()">2. Chấm công bằng Face ID</button>
  
  <div id="status"></div>
</div>

<script>
  // Bước 1: Đăng ký Face ID lưu vào thiết bị (Chỉ cần làm 1 lần)
  async function dangKyFaceID() {
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = "🔒 Đang đăng ký Face ID với thiết bị...";
    
    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: challenge,
          rp: { name: "Fumeni ERP", id: window.location.hostname },
          user: { 
            id: new Uint8Array(16), 
            name: "nhanvien@fumeni", 
            displayName: "Nhân viên Fumeni" 
          },
          pubKeyCredParams: [{ type: "publickey", alg: -7 }],
          timeout: 60000,
          authenticatorSelection: { 
            authenticatorAttachment: "platform", // Ép buộc dùng sinh trắc học có sẵn trên máy
            userVerification: "required" 
          }
        }
      });

      if (credential) {
        statusEl.innerHTML = "✅ Đăng ký Face ID thành công! Giờ bạn có thể bấm Chấm công.";
        statusEl.style.color = "green";
      }
    } catch (err) {
      console.error(err);
      statusEl.innerHTML = "❌ Đăng ký thất bại: " + err.message;
      statusEl.style.color = "red";
    }
  }

  // Bước 2: Chấm công bằng Face ID đã lưu
  async function thucHienChamCong() {
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = "🔒 Đang gọi Face ID để chấm công...";
    statusEl.style.color = "#0056b3";

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const credential = await navigator.credentials.get({
        publicKey: {
          challenge: challenge,
          timeout: 60000,
          userVerification: "required"
        }
      });

      if (credential) {
        statusEl.innerHTML = "⏳ Xác thực thành công! Đang gửi về Google Sheet...";

        // Thay link /exec Google Apps Script của bạn vào đây
        const gasUrl = "https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec";
        const timestamp = new Date().getTime();
        const targetUrl = `${gasUrl}?action=cham_cong&timestamp=${timestamp}`;

        const response = await fetch(targetUrl);
        const resultText = await response.text();

        statusEl.innerHTML = "✅ " + resultText;
        statusEl.style.color = "green";
      }
    } catch (err) {
      console.error(err);
      statusEl.innerHTML = "❌ Xác thực thất bại hoặc chưa đăng ký Face ID.";
      statusEl.style.color = "red";
    }
  }
</script>
</body>
</html>
