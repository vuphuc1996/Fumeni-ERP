<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test WebAuthn & GAS</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f6f9; }
    .btn { background: #0056b3; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
    iframe { width: 100%; height: 250px; border: 2px dashed #0056b3; border-radius: 8px; background: white; }
  </style>
</head>
<body>

  <h2>Hệ thống Test Xác thực</h2>
  <button class="btn" onclick="testXacThuc()">🔒 Quét Face ID / Vân tay</button>

  <!-- Dán URL Web App của Google Apps Script vào thuộc tính src dưới đây -->
  <iframe id="appGasFrame" src="https://script.google.com/macros/s/AKfycbxH2c2u9NxhW1lu6Ll2HOWFx932CU5anzcwV4pLMYV8go-kSPSt9iNNkK1eBMgrIYBc6Q/exec"></iframe>

  <script>
    async function testXacThuc() {
      if (!window.PublicKeyCredential) {
        alert("Trình duyệt của bạn không hỗ trợ WebAuthn!");
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        // Dùng navigator.credentials.get() để XÁC THỰC nhanh bằng Face ID / Vân tay
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            timeout: 60000,
            userVerification: "required", // Bắt buộc quét sinh trắc học
            rpId: window.location.hostname  // Khớp tên miền hiện tại của GitHub Pages
          }
        });

        if (credential) {
          // Xác thực thành công -> Gửi tín hiệu vào iframe GAS
          const iframe = document.getElementById('appGasFrame');
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({
              action: 'CHAM_CONG_APPROVED',
              timestamp: new Date().getTime()
            }, '*');
          }
        }
      } catch (err) {
        console.error("Lỗi WebAuthn:", err);
        alert("Xác thực thất bại hoặc bạn đã hủy thao tác. (Chi tiết: " + err.message + ")");
      }
    }
  </script>
</body>
</html>
